<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1180" viewBox="0 0 900 1180">
  <defs>
    <linearGradient id="leftHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a8c4ea"/>
      <stop offset="100%" stop-color="#d8e7fb"/>
    </linearGradient>
    <linearGradient id="rightHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dcefc0"/>
      <stop offset="100%" stop-color="#c4e59b"/>
    </linearGradient>
    <linearGradient id="nodeBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff9e8"/>
      <stop offset="100%" stop-color="#fff2c8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#222"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; fill: #222; }
      .title { font-size: 28px; font-weight: 700; }
      .lane-title { font-size: 18px; font-weight: 700; }
      .node-text { font-size: 15px; font-weight: 600; }
      .small-text { font-size: 14px; font-weight: 600; }
      .outer { fill: #ffffff; stroke: #333; stroke-width: 2; }
      .header { stroke: #555; stroke-width: 1.5; }
      .divider { stroke: #333; stroke-width: 2; }
      .node { fill: url(#nodeBg); stroke: #c8a23b; stroke-width: 2; }
      .arrow { stroke: #222; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="10" y="10" width="880" height="1160" class="outer"/>
  <text x="450" y="34" text-anchor="middle" class="title">业务场景三：AI旅游助手规划行程 — UML活动图</text>

  <rect x="10" y="52" width="385" height="32" fill="url(#leftHeader)" class="header"/>
  <rect x="395" y="52" width="495" height="32" fill="url(#rightHeader)" class="header"/>
  <text x="202" y="74" text-anchor="middle" class="lane-title">游客（小张）</text>
  <text x="642" y="74" text-anchor="middle" class="lane-title">系统（平台）</text>

  <line x1="395" y1="52" x2="395" y2="1170" class="divider"/>

  <circle cx="202" cy="105" r="13" fill="#000"/>

  <rect x="105" y="145" width="190" height="56" rx="14" ry="14" class="node"/>
  <text x="200" y="178" text-anchor="middle" class="node-text">打开迈开腿平台</text>
  <text x="200" y="196" text-anchor="middle" class="node-text">进入“AI旅游助手”</text>

  <rect x="82" y="235" width="238" height="70" rx="14" ry="14" class="node"/>
  <text x="201" y="264" text-anchor="middle" class="node-text">输入出行需求：</text>
  <text x="201" y="287" text-anchor="middle" class="small-text">云南大理、丽江5天路线，预算3000元</text>

  <rect x="515" y="245" width="198" height="50" rx="14" ry="14" class="node"/>
  <text x="614" y="275" text-anchor="middle" class="node-text">接收并解析用户需求</text>

  <rect x="515" y="340" width="198" height="56" rx="14" ry="14" class="node"/>
  <text x="614" y="372" text-anchor="middle" class="node-text">调用DeepSeek大模型</text>

  <rect x="80" y="365" width="242" height="62" rx="14" ry="14" class="node"/>
  <text x="201" y="391" text-anchor="middle" class="node-text">等待AI生成旅游方案</text>
  <text x="201" y="413" text-anchor="middle" class="small-text">查看规划过程</text>

  <rect x="495" y="435" width="238" height="104" rx="14" ry="14" class="node"/>
  <text x="614" y="463" text-anchor="middle" class="node-text">生成5天旅游路线</text>
  <text x="614" y="486" text-anchor="middle" class="small-text">第1天：抵达大理古城</text>
  <text x="614" y="508" text-anchor="middle" class="small-text">第2天：洱海环湖游</text>
  <text x="614" y="530" text-anchor="middle" class="small-text">第3天：前往丽江古城</text>

  <rect x="495" y="570" width="238" height="102" rx="14" ry="14" class="node"/>
  <text x="614" y="598" text-anchor="middle" class="node-text">补充后续安排与推荐</text>
  <text x="614" y="621" text-anchor="middle" class="small-text">第4天：玉龙雪山</text>
  <text x="614" y="643" text-anchor="middle" class="small-text">第5天：返程</text>
  <text x="614" y="665" text-anchor="middle" class="small-text">推荐景区门票和住宿建议</text>

  <rect x="95" y="575" width="212" height="58" rx="14" ry="14" class="node"/>
  <text x="201" y="609" text-anchor="middle" class="node-text">查看AI生成的行程方案</text>

  <rect x="95" y="700" width="212" height="58" rx="14" ry="14" class="node"/>
  <text x="201" y="734" text-anchor="middle" class="node-text">点击“收藏方案”</text>

  <rect x="500" y="704" width="228" height="50" rx="14" ry="14" class="node"/>
  <text x="614" y="734" text-anchor="middle" class="node-text">保存该旅游方案并提示成功</text>

  <rect x="86" y="812" width="230" height="70" rx="14" ry="14" class="node"/>
  <text x="201" y="841" text-anchor="middle" class="node-text">根据推荐点击进入</text>
  <text x="201" y="864" text-anchor="middle" class="small-text">景区详情页查看门票信息</text>

  <rect x="495" y="822" width="238" height="50" rx="14" ry="14" class="node"/>
  <text x="614" y="852" text-anchor="middle" class="node-text">展示景区详情与门票信息</text>

  <rect x="85" y="925" width="232" height="58" rx="14" ry="14" class="node"/>
  <text x="201" y="959" text-anchor="middle" class="node-text">浏览门票与住宿建议</text>

  <circle cx="202" cy="1045" r="18" fill="#fff" stroke="#000" stroke-width="3"/>
  <circle cx="202" cy="1045" r="10" fill="#000"/>

  <path d="M202 118 L202 145" class="arrow"/>
  <path d="M202 201 L202 235" class="arrow"/>
  <path d="M322 270 L515 270" class="arrow"/>
  <path d="M614 295 L614 340" class="arrow"/>
  <path d="M515 368 L322 395" class="arrow"/>
  <path d="M614 396 L614 435" class="arrow"/>
  <path d="M614 539 L614 570" class="arrow"/>
  <path d="M495 621 L307 604" class="arrow"/>
  <path d="M201 633 L201 700" class="arrow"/>
  <path d="M307 729 L500 729" class="arrow"/>
  <path d="M201 758 L201 812" class="arrow"/>
  <path d="M316 847 L495 847" class="arrow"/>
  <path d="M201 882 L201 925" class="arrow"/>
  <path d="M201 983 L201 1027" class="arrow"/>
</svg>

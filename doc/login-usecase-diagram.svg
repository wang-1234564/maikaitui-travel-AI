<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fbff"/>
      <stop offset="100%" stop-color="#eef5ff"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f6db5"/>
      <stop offset="100%" stop-color="#5b9be6"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#2b4158"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; fill: #1e2f40; }
      .title { font-size: 32px; font-weight: 700; fill: #fff; }
      .label { font-size: 22px; font-weight: 700; }
      .small { font-size: 18px; font-weight: 600; }
      .sys { fill: #ffffff; stroke: #4e78a7; stroke-width: 3; }
      .actor { fill: #ffffff; stroke: #4e78a7; stroke-width: 3; }
      .ellipse { fill: #fffdf6; stroke: #c59a2f; stroke-width: 3; }
      .line { stroke: #2b4158; stroke-width: 3; fill: none; }
      .dash { stroke-dasharray: 10 8; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="url(#bg)"/>
  <rect x="40" y="28" width="1120" height="86" rx="22" fill="url(#header)"/>
  <text x="600" y="82" text-anchor="middle" class="title">登录功能 UML 用例图</text>

  <rect x="355" y="150" width="520" height="530" rx="20" class="sys"/>
  <text x="615" y="192" text-anchor="middle" class="label">迈开腿旅游平台</text>

  <ellipse cx="615" cy="275" rx="118" ry="44" class="ellipse"/>
  <text x="615" y="282" text-anchor="middle" class="label">用户登录</text>

  <ellipse cx="615" cy="395" rx="130" ry="44" class="ellipse"/>
  <text x="615" y="402" text-anchor="middle" class="small">输入用户名和密码</text>

  <ellipse cx="615" cy="515" rx="110" ry="44" class="ellipse"/>
  <text x="615" y="522" text-anchor="middle" class="small">身份验证</text>

  <ellipse cx="615" cy="625" rx="110" ry="44" class="ellipse"/>
  <text x="615" y="632" text-anchor="middle" class="small">生成 JWT 令牌</text>

  <g transform="translate(120,250)">
    <circle cx="0" cy="-70" r="22" class="actor"/>
    <line x1="0" y1="-48" x2="0" y2="28" class="line"/>
    <line x1="-42" y1="-10" x2="42" y2="-10" class="line"/>
    <line x1="0" y1="28" x2="-34" y2="88" class="line"/>
    <line x1="0" y1="28" x2="34" y2="88" class="line"/>
    <text x="0" y="126" text-anchor="middle" class="label">注册用户</text>
  </g>

  <g transform="translate(120,520)">
    <circle cx="0" cy="-70" r="22" class="actor"/>
    <line x1="0" y1="-48" x2="0" y2="28" class="line"/>
    <line x1="-42" y1="-10" x2="42" y2="-10" class="line"/>
    <line x1="0" y1="28" x2="-34" y2="88" class="line"/>
    <line x1="0" y1="28" x2="34" y2="88" class="line"/>
    <text x="0" y="126" text-anchor="middle" class="label">管理员</text>
  </g>

  <g transform="translate(1020,390)">
    <circle cx="0" cy="-70" r="22" class="actor"/>
    <line x1="0" y1="-48" x2="0" y2="28" class="line"/>
    <line x1="-42" y1="-10" x2="42" y2="-10" class="line"/>
    <line x1="0" y1="28" x2="-34" y2="88" class="line"/>
    <line x1="0" y1="28" x2="34" y2="88" class="line"/>
    <text x="0" y="126" text-anchor="middle" class="label">Auth认证服务</text>
  </g>

  <path d="M162 250 L497 275" class="line"/>
  <path d="M162 520 L497 286" class="line"/>
  <path d="M913 390 L725 515" class="line"/>
  <path d="M913 390 L725 625" class="line"/>

  <path d="M615 319 L615 351" class="line dash" marker-end="url(#arrow)"/>
  <text x="646" y="340" class="small">«include»</text>

  <path d="M615 439 L615 471" class="line dash" marker-end="url(#arrow)"/>
  <text x="646" y="460" class="small">«include»</text>

  <path d="M615 559 L615 581" class="line dash" marker-end="url(#arrow)"/>
  <text x="646" y="575" class="small">«include»</text>
</svg>

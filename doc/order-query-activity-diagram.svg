<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1220" viewBox="0 0 900 1220">
  <defs>
    <linearGradient id="leftHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a8c4ea"/>
      <stop offset="100%" stop-color="#d8e7fb"/>
    </linearGradient>
    <linearGradient id="rightHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dcefc0"/>
      <stop offset="100%" stop-color="#c4e59b"/>
    </linearGradient>
    <linearGradient id="nodeBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff9e8"/>
      <stop offset="100%" stop-color="#fff2c8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#222"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; fill: #222; }
      .title { font-size: 28px; font-weight: 700; }
      .lane-title { font-size: 18px; font-weight: 700; }
      .node-text { font-size: 15px; font-weight: 600; }
      .small-text { font-size: 14px; font-weight: 600; }
      .outer { fill: #ffffff; stroke: #333; stroke-width: 2; }
      .header { stroke: #555; stroke-width: 1.5; }
      .divider { stroke: #333; stroke-width: 2; }
      .node { fill: url(#nodeBg); stroke: #c8a23b; stroke-width: 2; }
      .arrow { stroke: #222; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect x="10" y="10" width="880" height="1200" class="outer"/>
  <text x="450" y="34" text-anchor="middle" class="title">业务场景五：游客查询订单 — UML活动图</text>

  <rect x="10" y="52" width="385" height="32" fill="url(#leftHeader)" class="header"/>
  <rect x="395" y="52" width="495" height="32" fill="url(#rightHeader)" class="header"/>
  <text x="202" y="74" text-anchor="middle" class="lane-title">游客（小陈）</text>
  <text x="642" y="74" text-anchor="middle" class="lane-title">系统（平台）</text>

  <line x1="395" y1="52" x2="395" y2="1210" class="divider"/>

  <circle cx="202" cy="105" r="13" fill="#000"/>

  <rect x="85" y="145" width="234" height="76" rx="14" ry="14" class="node"/>
  <text x="202" y="176" text-anchor="middle" class="node-text">完成故宫门票购买后</text>
  <text x="202" y="202" text-anchor="middle" class="small-text">想确认订单是否支付成功</text>

  <rect x="108" y="262" width="188" height="56" rx="14" ry="14" class="node"/>
  <text x="202" y="295" text-anchor="middle" class="node-text">打开“个人中心”</text>

  <rect x="505" y="266" width="218" height="50" rx="14" ry="14" class="node"/>
  <text x="614" y="296" text-anchor="middle" class="node-text">展示个人中心页面</text>

  <rect x="103" y="372" width="198" height="58" rx="14" ry="14" class="node"/>
  <text x="202" y="406" text-anchor="middle" class="node-text">进入“我的订单”页面</text>

  <rect x="495" y="356" width="238" height="92" rx="14" ry="14" class="node"/>
  <text x="614" y="386" text-anchor="middle" class="node-text">查询并展示订单列表</text>
  <text x="614" y="412" text-anchor="middle" class="small-text">包含订单编号、景区名称</text>
  <text x="614" y="436" text-anchor="middle" class="small-text">购票数量、总金额、订单状态</text>

  <rect x="103" y="500" width="198" height="58" rx="14" ry="14" class="node"/>
  <text x="202" y="534" text-anchor="middle" class="node-text">查看订单状态信息</text>

  <rect x="500" y="500" width="228" height="58" rx="14" ry="14" class="node"/>
  <text x="614" y="534" text-anchor="middle" class="node-text">显示订单状态：已支付</text>

  <rect x="103" y="624" width="198" height="58" rx="14" ry="14" class="node"/>
  <text x="202" y="658" text-anchor="middle" class="node-text">确认订单支付成功</text>

  <rect x="103" y="742" width="198" height="58" rx="14" ry="14" class="node"/>
  <text x="202" y="776" text-anchor="middle" class="node-text">点击订单详情</text>

  <rect x="495" y="726" width="238" height="92" rx="14" ry="14" class="node"/>
  <text x="614" y="756" text-anchor="middle" class="node-text">展示订单详情信息</text>
  <text x="614" y="782" text-anchor="middle" class="small-text">游览日期</text>
  <text x="614" y="806" text-anchor="middle" class="small-text">联系人信息</text>

  <rect x="85" y="878" width="234" height="58" rx="14" ry="14" class="node"/>
  <text x="202" y="912" text-anchor="middle" class="node-text">查看游览日期和联系人信息</text>

  <circle cx="202" cy="1040" r="18" fill="#fff" stroke="#000" stroke-width="3"/>
  <circle cx="202" cy="1040" r="10" fill="#000"/>

  <path d="M202 118 L202 145" class="arrow"/>
  <path d="M202 221 L202 262" class="arrow"/>
  <path d="M296 290 L505 290" class="arrow"/>
  <path d="M202 318 L202 372" class="arrow"/>
  <path d="M301 401 L495 401" class="arrow"/>
  <path d="M202 430 L202 500" class="arrow"/>
  <path d="M301 529 L500 529" class="arrow"/>
  <path d="M202 558 L202 624" class="arrow"/>
  <path d="M202 682 L202 742" class="arrow"/>
  <path d="M301 771 L495 771" class="arrow"/>
  <path d="M202 800 L202 878" class="arrow"/>
  <path d="M202 936 L202 1022" class="arrow"/>
</svg>

server:
  port: 8400
spring:
  application:
    name: maikaitui-file
  cloud:
    nacos:
      server-addr: 127.0.0.1:8848
      username: nacos
      password: nacos
      config:
        file-extension: yaml
  config:
    import: optional:nacos:${spring.application.name}.yaml
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB
